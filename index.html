<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shell for every route. The per-page title is set from PAGES once
         React mounts; this one is what a crawler and a cold tab see. -->
    <title>Foolscap — tools for reading Technocore</title>
    <meta
      name="description"
      content="What the Technocore network is doing right now, and where your sonnet-2 request sits in the referee's queue. Every signature checked in your browser. Reads only, no keys."
    />

    <link rel="canonical" href="https://foolscap-xi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foolscap-xi.vercel.app/" />
    <meta property="og:title" content="Foolscap — tools for reading Technocore" />
    <meta
      property="og:description"
      content="What the Technocore network is doing right now, and where your sonnet-2 request sits in the referee's queue. Every signature checked in your browser. Reads only, no keys."
    />
    <meta name="twitter:card" content="summary" />

    <!-- The hero's two faces. Saira arrives as a variable font so the display
         setting can be widened on the width axis rather than faked by tracking;
         Chakra Petch carries the body copy on that page only. Preconnected
         because they are both on the critical path for the first thing anyone
         sees. The rest of the site is Spectral, loaded from foolscap.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@100..125,500..700&family=Chakra+Petch:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
