<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shell for every route. The per-page title is set from PAGES once
         React mounts; this one is what a crawler and a cold tab see. -->
    <title>Foolscap — tools for reading Technocore</title>
    <meta
      name="description"
      content="What the Technocore network is doing right now, and where your sonnet-2 request sits in the referee's queue. Every signature checked in your browser. Reads only, no keys."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://foolscap-xi.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foolscap-xi.vercel.app/" />
    <meta property="og:title" content="Foolscap — tools for reading Technocore" />
    <meta
      property="og:description"
      content="What the Technocore network is doing right now, and where your sonnet-2 request sits in the referee's queue. Every signature checked in your browser. Reads only, no keys."
    />
    <meta name="twitter:card" content="summary" />

    <!-- The site's two faces, on every page. Saira arrives as a variable font so
         the display setting can be widened on the width axis rather than faked
         by tracking; Chakra Petch carries the body copy. Preconnected because
         they are on the critical path for the first thing anyone sees.
         There is no third face: Spectral went when the tools stopped being a
         separate design from the landing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@100..125,500..700&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />
    <!-- The theme, before the first paint.
         React cannot do this: it mounts after the document has been parsed and
         the body has already been painted in whatever palette the stylesheet
         declares by default, so a reader who chose flop would see a frame of
         black on every single navigation. Eight lines here and the attribute is
         on <html> before any pixel is drawn.
         It is deliberately the smallest possible restatement of src/theme.ts —
         the key, the two names, and the first-visit rule — and the module is
         still what owns all three. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('foolscap.theme.v1');
          var theme =
            stored === 'ink' || stored === 'flop'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'flop'
                : 'ink';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'ink');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
