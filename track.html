<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foolscap — track my batch</title>
    <meta
      name="description"
      content="Where your sonnet-2 request sits in the referee's queue, and whether the referee is alive. Reads only."
    />

    <link rel="canonical" href="https://foolscap-xi.vercel.app/track.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foolscap-xi.vercel.app/track.html" />
    <meta property="og:title" content="Foolscap — track my batch" />
    <meta
      property="og:description"
      content="Paste a request_id or a did:key for your queue position, an ETA, and whether the referee is alive. Every receipt verified against the pinned referee DID."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="css/foolscap.css" />
  </head>

  <!-- The nav, the page header and the colophon come from js/shell.js. -->
  <body data-page="track">
    <main class="shell">
      <div id="progress" class="progress measure" aria-live="polite" hidden>
        <p class="progress__text"></p>
        <div class="progress__track"><div class="progress__fill"></div></div>
      </div>

      <section class="section measure" id="lookup">
        <h2 class="section__title">Track my batch</h2>

        <form class="lookup" id="lookup-form" autocomplete="off">
          <label class="lookup__label" for="q">A request_id, or a did:key</label>
          <div class="lookup__row">
            <input
              class="lookup__input mono"
              id="q"
              name="q"
              type="text"
              inputmode="text"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="ace-reg-writer-1"
            />
            <button class="lookup__submit" type="submit">Look up</button>
          </div>
        </form>

        <div class="result" id="lookup-result" aria-live="polite"></div>
      </section>

      <section class="section measure" id="referee">
        <h2 class="section__title">The referee</h2>
        <div id="referee-panel" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="js/shell.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
