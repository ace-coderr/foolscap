# Fly, as the alternative to Railway. Same image, same process.
#
# One machine, and auto-stop off: this service is not a request handler that can
# sleep between visitors. The mirror has to keep following rooms whether or not
# anybody is reading the API, and a stopped machine is an hour of history lost
# that no later run can recover.

app = "foolscap-notary"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NOTARY_RUN_MIRROR = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.http_options.response.headers]
    # The static site calls this from another origin; the API sets its own CORS
    # headers, and this stops a proxy-level default from contradicting them.
    Access-Control-Allow-Origin = "*"

[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/notary/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
