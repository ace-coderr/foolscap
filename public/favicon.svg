  <path d="M6.649 6.969A13 13 0 0 1 8.176 5.618" opacity=".6"/>
  <path d="M10.816 4.078A13 13 0 0 1 11.983 3.636" opacity=".4"/>
  <path d="M14.98 3.04A13 13 0 0 1 15.546 3.008" opacity=".25"/>
  <circle cx="22.5" cy="4.742" r="2.9" fill="#ffffff" stroke="none"/>
