<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
  <!-- The Foolscap mark: a ring rotating its history away, and the one record
       kept. Same construction as src/components/Mark.tsx, drawn on a radius of
